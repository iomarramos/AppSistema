name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cliente de PostgreSQL
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Ejecutar todas las pruebas
        run: ./ejecutar_pruebas.sh

  # Pruebas de punta a punta de la aplicación WinForms (FlaUI / UI Automation) sobre AppSistema.exe real, con una base
  # PostgreSQL 16 temporal. Sube las capturas de cada pantalla como artefacto.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write   # publicar las capturas en la rama e2e-capturas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: PostgreSQL 16
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          postgres-version: '16'
      - name: Compilar aplicacion y pruebas E2E
        run: dotnet build tests/AppSistema.E2E.Tests -c Release --nologo
      - name: Pruebas E2E (FlaUI)
        env:
          APPSISTEMA_E2E: '1'
          APPSISTEMA_E2E_PG: 'Host=localhost;Port=5432;Username=postgres;Password=postgres'
        run: dotnet test tests/AppSistema.E2E.Tests -c Release --no-build --nologo --logger "trx;LogFileName=e2e.trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results
      - name: Subir capturas y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-capturas
          path: artifacts/
          if-no-files-found: warn
      # Las capturas también quedan en la rama e2e-capturas (solo en push), para verlas sin descargar el artefacto.
      - name: Publicar capturas en la rama e2e-capturas
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d artifacts/screenshots ] || exit 0
          cd artifacts/screenshots
          git init -q -b e2e-capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas E2E de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:e2e-capturas
